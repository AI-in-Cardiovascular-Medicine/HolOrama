common:
  # Shared by intravascular and ccta; editable from either page's Settings dialog.
  windowing_sensitivity: 0.03  # lower = slower. Raw 0-255 scale here; ccta rescales by its HU range
  zoom_sensitivity: 0.005  # fraction of zoom per pixel dragged
  default_mask_alpha: 0.45  # segmentation overlay opacity (0 = transparent, 1 = opaque)

intravascular:
  image_size: 800
  contour_preset: 'Default'            # the contour types to annotate with (Settings > Intravascular Contour Settings)
  gating_display_stretch: 1
  lview_display_stretch: 1
  n_interactive_points: 20  # a drawn lumen or EEM gets this many, other drawn types half, contours read from a mask all of it
  n_interactive_points_range: [3, 40]  # what the Points box and Shift+Wheel keep a contour's knot count within
  n_points_contour: 200  # ideally a multiple of 100 (closest-point maths)
  contour_thickness: 2
  point_thickness: 1
  point_radius: 10
  snap_radius_px: 5   # how close a click must land to grab a point or close a contour
  insert_point_radius_px: 20  # how close to a contour line a click must land to insert a point there
  initial_window_level: 128  # centre of the displayed intensity range (brightness), what R resets to
  initial_window_width: 256  # width of the displayed intensity range (contrast), what R resets to
  # Every contour type's colour is set in its contour preset (src/presets/intravascular).
  color_start_point: 'yellow'  # PyQt6 color name or hex (https://doc.qt.io/qt-6/qcolor.html)
  color_end_point: 'red'
  color_reference: 'yellow'  # the reference point (not a contour type, so not in the presets)
  angle_handle_radius_mm: 5.0  # how far from the image centre a wire/blood sector's handles and arc sit
  alpha_contour: 100  # 0-255
  catheter_diameter: 0.9  # mm, drawn in the OCT vessel schematic (0.9 = 2.7 F)

ccta:
  # The name and colour of each mask label (Settings > CCTA Contour Settings)
  contour_preset: 'Calcification included'

fusion: {}  # no fusion settings yet; placeholder so config stays organized by module

gating:
  normalize_step: 100
  # Heart rate search range [Hz], covering rest to stress
  f_cardiac_min: 0.75         # ~45 BPM
  f_cardiac_max: 3.3333       # ~200 BPM
  # Bandpass cuts, as fractions of the detected f_heart
  bandpass_lo_frac: 0.7      # drops the slow pullback trend
  bandpass_hi_frac: 2.2      # keeps the 2nd harmonic, drops speckle noise

report:
  save_as_csv: True

save:
  autosave_interval: 15000  # in ms
  save_niftis: 'none'  # which frames to save as NIfTi: 'contoured', 'all', 'none'
  save_2d: False
  save_3d: True

centerlines:
  # Calculate Centerlines runs vmtk in its own conda-forge environment, managed by pixi and set
  # up on first use (HolOrama offers to download pixi + vmtk, ~1.5 GB on disk). Empty = the defaults.
  env_dir: ''    # where that environment lives; empty = <per-user data dir>/vmtk-env
  pixi_path: ''  # a pixi executable to use; empty = pixi on PATH, else the copy HolOrama downloads

segmentation:
  # Automatic IVUS lumen segmentation (ONNX). Empty = the bundled model;
  # otherwise a .onnx exported with scripts/model_export/export_onnx.py.
  model_file: ''
  # 'auto' = GPU if one works (Windows: any DirectX 12 GPU via DirectML; NVIDIA via CUDA with the
  # segmentation-gpu extra), else CPU. 'directml' / 'cuda' = that GPU or refuse; 'cpu' = always CPU.
  device: 'auto'
  # GPU only, the CPU always runs fp32. 'fp16' = the model's _fp16.onnx copy (~1.3-1.5x faster on
  # most GPUs, a few border pixels per frame differ); 'auto' = fp16 when it is clearly faster on
  # this GPU (not on e.g. GTX 10xx), else fp32; 'fp32' = always the validated full precision.
  precision: 'auto'
  use_mirroring: True  # test-time mirroring as in nnU-Net; ~4x slower, noticeably better masks
  tile_step_size: 0.5  # sliding-window overlap, as in nnU-Net
  batch_size: 2        # tiles per network call (2 = one 512x512 frame); larger: not faster on CPU, OOM risk on a 6-8 GB GPU
  num_threads: 0       # CPU threads for inference; 0 = all cores
