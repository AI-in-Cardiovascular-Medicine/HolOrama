[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holOrama"
dynamic = ["version"]
description = "holOrama: A PyQt6-based application for 3D visualization, analysis and fusion of cardiac images (IVUS, OCT and CT)."
authors = [
    { name = "yungselm" },
    { name = "cardionaut" },
    { name = "Pooya Mohammadi Kazaj" },
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "loguru",
    "tqdm",
    "matplotlib",
    "pandas",
    "scipy",
    "scikit-image",
    "numpy>=2.0.0",
    "pyyaml",
    "pydicom==2.4.4",
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "PyQt6>=6.10.2",
    "pyqtdarktheme>=2.1.0",
    "shapely",
    "SimpleITK",
    "opencv-python-headless>=4.9.0.80",
    "vtk",
    "trimesh",
    "nibabel",
    "multimodars[meshlab]>=0.10.1",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Automatic IVUS segmentation: the nnU-Net model runs as ONNX, no torch needed (see
# src/segmentation/onnx_inference.py). Installed by default by the install scripts and always
# included in the compiled build; without it the feature reports itself unavailable.
# On Windows the DirectML build: any DirectX 12 GPU (NVIDIA, AMD, Intel) without a CUDA
# install, falling back to the CPU; +25 MB. Elsewhere the CPU build.
segmentation = [
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
]
# Same, on an NVIDIA GPU (Windows/Linux): CUDA 12 + cuDNN 9 come as pip wheels, no CUDA toolkit
# install needed, only an NVIDIA driver >= 527.41 (Windows) / 525.60 (Linux). Pinned below 1.27,
# which moved to CUDA 13 (driver >= 580) and would silently drop older workstations to the CPU.
# Use instead of 'segmentation' (both provide the `onnxruntime` module). Source installs only;
# the compiled installer is CPU-only.
segmentation-gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27; sys_platform != 'darwin'",
]
# Centerlines (vmtk) are not a Python extra: vmtk only exists on conda-forge and runs in its
# own pixi-managed environment, see src/centerlines/vmtk_env/.

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "pytest-mock>=3.16.0",
    "pytest-cov>=7.1.0",
    "black>=26.10.0",
    "mypy",
    "ruff",
    # >= 4.2: with the Zig compiler Nuitka targets the generic x86-64 baseline. Older versions
    # compiled for the build machine's CPU, so an exe built on an AVX-512 desktop crashed with
    # STATUS_ILLEGAL_INSTRUCTION (0xc000001d) on CPUs without it (e.g. Ryzen 5000).
    "nuitka>=4.2.2",
]
docs = [
    "sphinx",
    "furo",
    "sphinx-autodoc-typehints",
    "myst-parser",
]

[tool.hatch.version]
path = "src/version.py"

[tool.uv]
package = false
conflicts = [
    [{ extra = "segmentation" }, { extra = "segmentation-gpu" }],
]
constraint-dependencies = [
    # segmentation-gpu: nvidia-cublas-cu12 12.9.3.13 has no Windows wheel.
    "nvidia-cublas-cu12<12.9.3; sys_platform == 'win32'",
    # segmentation-gpu: newer cuDNN fails on the first convolution with onnxruntime-gpu 1.26
    # (CUDNN_BACKEND_API_FAILED); 9.10.2 is verified on an RTX 3060 (driver 591).
    "nvidia-cudnn-cu12>=9.5,<9.11",
]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
profile = "black"
