name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks (same checks as local)
        run: pre-commit run --all-files

  test:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux - needed for PyQt6)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 libdbus-1-3 libegl1 libpulse0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Exactly the locked environment install.ps1 / install.sh create (core + segmentation extra).
      - name: Install dependencies (uv.lock)
        run: uv sync --locked --extra segmentation --group dev

      - name: Run tests (Linux - headless Qt via offscreen platform)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-sync pytest
